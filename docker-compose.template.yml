services:
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped

  backend:
    build:
        context: ./backend
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/html:ro
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: dbname
      DB_USER: user
      DB_PASSWORD: pass
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: dbname
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - dbdata:/var/lib/mysql
    restart: unless-stopped

volumes:
  dbdata:
